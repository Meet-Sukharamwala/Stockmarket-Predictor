# config.yaml
data:
  symbols: ["AAPL", "MSFT", "GOOGL"]
  start_date: "2018-01-01"
  end_date: "2024-01-01"
  interval: "1d"

preprocessing:
  test_size: 0.2
  random_state: 42
  scale: true

features:
  window_sizes: [5, 20, 50]
  lags: [1, 2, 3, 5, 10]

models:
  random_forest:
    n_estimators: 100
    max_depth: 10
    random_state: 42
  xgboost:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 5

lstm:
  lookback: 60
  epochs: 50
  batch_size: 32
  units: 50

forecast:
  days: 30

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"